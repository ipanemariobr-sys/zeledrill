<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美容室スタイリスト 係数ドリル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: #FDF6F9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    width: 100%;
    max-width: 540px;
    margin-bottom: 24px;
    text-align: center;
  }

  header .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #D4537E;
    margin-bottom: 6px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #2C1A22;
  }

  header p {
    font-size: 13px;
    color: #999;
    margin-top: 4px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 540px;
    padding: 28px 24px;
    box-shadow: 0 2px 16px rgba(212,83,126,0.08);
  }

  .progress-wrap { margin-bottom: 20px; }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .q-num { font-size: 12px; font-weight: 600; color: #999; letter-spacing: 0.08em; }

  .q-cat {
    font-size: 11px;
    background: #FBEAF0;
    color: #993556;
    padding: 3px 10px;
    border-radius: 99px;
    font-weight: 600;
  }

  .difficulty {
    font-size: 12px;
    color: #D4537E;
    letter-spacing: 0.05em;
  }

  .progress-bar-bg {
    height: 5px;
    background: #F0E0E8;
    border-radius: 99px;
  }

  .progress-bar-fill {
    height: 5px;
    background: linear-gradient(90deg, #D4537E, #E87FAA);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .question-text {
    font-size: 17px;
    font-weight: 600;
    color: #2C1A22;
    line-height: 1.65;
    margin: 20px 0 18px;
  }

  .choices { display: flex; flex-direction: column; gap: 10px; }

  .choice-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FAFAFA;
    border: 1.5px solid #EEE;
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    text-align: left;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .choice-btn:active { transform: scale(0.98); }
  .choice-btn:hover:not(:disabled) { border-color: #D4537E; background: #FEF0F5; }

  .choice-letter {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #EEE;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #888;
    flex-shrink: 0;
  }

  .choice-text { font-size: 15px; color: #2C1A22; line-height: 1.4; }

  .choice-btn.correct { background: #EAF3DE; border-color: #639922; }
  .choice-btn.correct .choice-letter { background: #639922; color: #fff; }
  .choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; }
  .choice-btn.wrong .choice-letter { background: #E24B4A; color: #fff; }
  .choice-btn.dimmed { opacity: 0.4; }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.65;
    display: none;
  }

  .feedback.correct-fb { background: #EAF3DE; color: #3B6D11; border: 1px solid #C0DD97; }
  .feedback.wrong-fb { background: #FCEBEB; color: #A32D2D; border: 1px solid #F09595; }

  .next-btn {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #D4537E, #E87FAA);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    display: none;
    letter-spacing: 0.04em;
    -webkit-tap-highlight-color: transparent;
  }

  .next-btn:active { transform: scale(0.98); }

  /* Result */
  .result-wrap { text-align: center; padding: 8px 0; }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid #D4537E;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    background: #FEF0F5;
  }

  .score-num { font-size: 40px; font-weight: 800; color: #D4537E; line-height: 1; }
  .score-label { font-size: 13px; color: #C07090; margin-top: 4px; }
  .result-msg { font-size: 18px; font-weight: 700; color: #2C1A22; margin-bottom: 6px; }
  .result-sub { font-size: 14px; color: #888; margin-bottom: 24px; line-height: 1.6; }

  .btn-row { display: flex; flex-direction: column; gap: 10px; }

  .retry-btn {
    padding: 14px;
    border-radius: 14px;
    border: 2px solid #D4537E;
    background: transparent;
    color: #D4537E;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .retry-btn:active { background: #FEF0F5; }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: #CCC;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <p class="logo">BEAUTY SALON DRILL</p>
  <h1>スタイリスト 係数ドリル</h1>
  <p>全20問｜木村テキスト準拠</p>
</header>

<div class="card" id="quiz-card">
  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="q-num" id="q-num">問題 1 / 20</span>
      <span class="q-cat" id="q-cat"></span>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span class="difficulty" id="q-diff"></span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress" style="width:0%"></div>
    </div>
  </div>

  <p class="question-text" id="q-text"></p>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQ()"></button>
</div>

<div class="card result-wrap" id="result-card" style="display:none">
  <div class="score-circle">
    <span class="score-num" id="score-num"></span>
    <span class="score-label" id="score-denom"></span>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <p class="result-sub" id="result-sub"></p>
  <div class="btn-row">
    <button class="retry-btn" onclick="startQuiz()">🔄 もう一度挑戦する</button>
  </div>
</div>

<footer>美容室スタイリスト向け学習ドリル｜木村テキスト準拠</footer>

<script>
const questions = [

  // ── 売上系 ──
  {
    category: "売上の基本",
    diff: "☆",
    text: "「売上」の正しい説明はどれか？",
    choices: [
      "スタッフの給与の合計金額",
      "お客様に技術と接客でおもてなしし、その対価として頂くお金",
      "薬剤・備品の仕入れにかかった費用",
      "1ヶ月の営業日数×1日の来客数"
    ],
    answer: 1,
    explanation: "売上とはお客様に技術と接客でおもてなしして、その対価として頂くお金のことです。売上が良い＝お客様に喜んでもらえた、と自信を持ちましょう！"
  },
  {
    category: "売上の基本",
    diff: "☆",
    text: "月間売上を求める計算式はどれか？",
    choices: [
      "客単価 ÷ 客数",
      "客単価 × 客数",
      "総売上 ÷ 営業日数",
      "技術売上 × 店販売上"
    ],
    answer: 1,
    explanation: "月間売上 ＝ 客単価 × 客数 です。年間売上は「客単価 × 客数 × 来店回数」で求めます。"
  },
  {
    category: "売上系",
    diff: "☆",
    text: "総売上の計算式として正しいものはどれか？",
    choices: [
      "技術売上 × 店販売上",
      "技術売上 ÷ 店販売上",
      "技術売上 + 店販売上（ホームケア）",
      "技術売上 − 店販売上"
    ],
    answer: 2,
    explanation: "総売上 ＝ 技術売上 ＋ 店販売上（ホームケア）です。技術と物販の両輪で売上を作ります。"
  },
  {
    category: "客単価",
    diff: "☆☆",
    text: "技術売上が280,000円、担当客数が50人のとき、技術単価はいくらか？",
    choices: ["4,000円", "5,000円", "5,600円", "6,000円"],
    answer: 2,
    explanation: "技術単価 ＝ 技術売上 ÷ 担当客数 ＝ 280,000 ÷ 50 ＝ 5,600円。客単価は自分の技術力の指標です。"
  },
  {
    category: "客単価",
    diff: "☆☆",
    text: "総売上目標が300,000円で、技術売上目標が280,000円のとき、店販売上目標はいくらか？",
    choices: ["10,000円", "15,000円", "20,000円", "25,000円"],
    answer: 2,
    explanation: "店販売上 ＝ 総売上 − 技術売上 ＝ 300,000 − 280,000 ＝ 20,000円。"
  },

  // ── 客数系 ──
  {
    category: "客数系",
    diff: "☆",
    text: "「総客数」の計算式として正しいものはどれか？",
    choices: [
      "指名客数 + フリー客数",
      "新規客数 + 固定客数（2回目〜常連）",
      "担当客数 + 失客数",
      "延客数 − 失客数"
    ],
    answer: 1,
    explanation: "総客数 ＝ 新規客数 ＋ 固定客数（2回目〜常連）です。担当客数（実客数）は「指名客数＋フリー客数」で求めます。"
  },
  {
    category: "客数系",
    diff: "☆",
    text: "「失客数」とはどのようなお客様のことか？",
    choices: [
      "初めて来店したお客様",
      "2回目以降の常連のお客様",
      "4か月以上来店がないお客様",
      "次回予約をしなかったお客様"
    ],
    answer: 2,
    explanation: "失客数とは4か月以上来店のない方のことです。失客を防ぐために次回予約率や再来店率を意識しましょう。"
  },
  {
    category: "客数系",
    diff: "☆☆",
    text: "「延客数」の説明として正しいものはどれか？",
    choices: [
      "担当した実際のお客様の人数",
      "メニュー客数の合計（カット＆カラー＆トリートメント＝3）",
      "新規客と固定客の合計",
      "4か月以内に再来店した客数"
    ],
    answer: 1,
    explanation: "延客数はメニュー客数の合計です。例：カット＆カラー＆トリートメントで来店した方は「3」と数えます。カットのみなら「1」です。"
  },
  {
    category: "客数系",
    diff: "☆☆",
    text: "総売上300,000円、スタッフ数3人のとき、1人当たり生産性はいくらか？",
    choices: ["50,000円", "100,000円", "150,000円", "300,000円"],
    answer: 1,
    explanation: "1人当たり生産性 ＝ 総売上 ÷ スタッフ数 ＝ 300,000 ÷ 3 ＝ 100,000円。スタッフ全員の生産性を高めることがサロン全体の成長につながります。"
  },
  {
    category: "客数系",
    diff: "☆☆",
    text: "技術売上目標280,000円、客単価6,000円のとき、目標担当客数は何人か？",
    choices: ["40人", "47人", "50人", "55人"],
    answer: 1,
    explanation: "目標担当客数 ＝ 技術売上目標 ÷ 客単価 ＝ 280,000 ÷ 6,000 ≒ 47人（小数点以下切り上げ）。"
  },

  // ── 比率系 ──
  {
    category: "比率系",
    diff: "☆",
    text: "比率（％）を求めるときの基本的な計算方法はどれか？",
    choices: [
      "足し算して100で割る",
      "割り算して×100する",
      "かけ算して100で割る",
      "引き算して×100する"
    ],
    answer: 1,
    explanation: "比率は割り算です。例：指名率 ＝ 指名客数 ÷ 担当客数 × 100。%で表すときは必ず×100してください。"
  },
  {
    category: "比率系",
    diff: "☆☆",
    text: "担当客数50人のうち、指名客が35人のとき指名率は何%か？",
    choices: ["50%", "60%", "70%", "75%"],
    answer: 2,
    explanation: "指名率 ＝ 指名客数 ÷ 担当客数 × 100 ＝ 35 ÷ 50 × 100 ＝ 70%。指名率が高いほど固定ファンが多い証拠です。"
  },
  {
    category: "比率系",
    diff: "☆☆",
    text: "担当客数50人のうち、カラー客が20人のときカラー比率（複合率）は何%か？",
    choices: ["20%", "30%", "40%", "50%"],
    answer: 2,
    explanation: "複合率（メニュー比率）＝ 各メニュー担当客数 ÷ 担当客数 × 100 ＝ 20 ÷ 50 × 100 ＝ 40%。"
  },
  {
    category: "比率系",
    diff: "☆☆☆",
    text: "パーマ比率を30%にしたい。担当客数が50人のとき、目標パーマ客数は何人か？",
    choices: ["10人", "13人", "15人", "20人"],
    answer: 2,
    explanation: "目標人数 ＝ 担当客数 × 比率 ÷ 100 ＝ 50 × 30 ÷ 100 ＝ 15人。比率から逆算して目標を立てることが大切です。"
  },
  {
    category: "比率系",
    diff: "☆☆",
    text: "今年の売上が360,000円、前年の売上が300,000円のとき、前年対比は何%か？",
    choices: ["80%", "100%", "120%", "160%"],
    answer: 2,
    explanation: "前年対比 ＝ 今年の数字 ÷ 前年の数字 × 100 ＝ 360,000 ÷ 300,000 × 100 ＝ 120%。100%超えなら昨年より成長しています。"
  },

  // ── 再来店率 ──
  {
    category: "再来店率",
    diff: "☆☆",
    text: "「新規再来店率」の正しい説明はどれか？",
    choices: [
      "3回目以上の常連客が4か月以内に来店した割合",
      "初めて来店した人が4か月以内に2回目の来店をした割合",
      "2回目来店した人が4か月以内に3回目の来店をした割合",
      "失客したお客様が戻ってきた割合"
    ],
    answer: 1,
    explanation: "新規再来店率＝初めて来店した人が4か月以内に2回目の来店をした割合です。例：1月新規10人→4か月以内に8人再来店→再来店率80%。"
  },
  {
    category: "再来店率",
    diff: "☆☆☆",
    text: "1月に新規客が10人来店。4か月以内に8人が再来店した。新規再来店率は何%か？",
    choices: ["40%", "60%", "80%", "100%"],
    answer: 2,
    explanation: "新規再来店率 ＝ 再来店人数 ÷ 新規客数 × 100 ＝ 8 ÷ 10 × 100 ＝ 80%。高いほど新規客をファンに変えられています。"
  },

  // ── 営業・消費税計算 ──
  {
    category: "日次計算",
    diff: "☆☆",
    text: "総売上目標が300,000円、営業日数が23日のとき、1日平均いくら売上れば達成できるか？（小数点以下切り上げ）",
    choices: ["10,000円", "11,000円", "13,044円", "15,000円"],
    answer: 2,
    explanation: "1日平均売上 ＝ 総売上目標 ÷ 営業日数 ＝ 300,000 ÷ 23 ≒ 13,044円。日々の目標に落とし込むことでゴールが見えやすくなります。"
  },
  {
    category: "消費税計算",
    diff: "☆☆",
    text: "税抜きカット料金4,000円に消費税10%を加えると、税込料金はいくらか？",
    choices: ["4,080円", "4,320円", "4,400円", "4,500円"],
    answer: 2,
    explanation: "税込料金 ＝ 税抜き × 1.10 ＝ 4,000 × 1.10 ＝ 4,400円。お客様に正確な料金を伝えるために消費税計算は必須スキルです。"
  },

  // ── 係数を持つ意義 ──
  {
    category: "係数を持つ意義",
    diff: "☆",
    text: "資料の中で「係数を知る＝ゴールを知る」に続く内容として正しいものはどれか？",
    choices: [
      "係数を知る ＝ センスが磨かれる",
      "係数を知る ＝ 目標を決められる ＝ 明確な判断基準がわかる",
      "係数を知る ＝ 売上が自動的に上がる",
      "係数を知る ＝ 技術が上達する"
    ],
    answer: 1,
    explanation: "係数を知る ＝ ゴールを知る ＝ 目標を決められる ＝ 明確な判断基準がわかる。数字は「目指したい美容師」への地図になります。"
  }

];

let current = 0, score = 0, answered = false;
const total = questions.length;

function startQuiz() {
  current = 0; score = 0; answered = false;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-card').style.display = 'block';
  showQ();
}

function showQ() {
  const q = questions[current];
  document.getElementById('progress').style.width = (current / total * 100) + '%';
  document.getElementById('q-num').textContent = '問題 ' + (current + 1) + ' / ' + total;
  document.getElementById('q-cat').textContent = q.category;
  document.getElementById('q-diff').textContent = '難易度 ' + q.diff;

  document.getElementById('q-text').textContent = q.text;

  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'none';
  answered = false;

  const letters = ['A', 'B', 'C', 'D'];
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = '<span class="choice-letter">' + letters[i] + '</span><span class="choice-text">' + c + '</span>';
    btn.onclick = () => selectAnswer(i);
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const btns = document.querySelectorAll('.choice-btn');
  const fb = document.getElementById('feedback');

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === idx && idx !== q.answer) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  if (idx === q.answer) {
    score++;
    fb.className = 'feedback correct-fb';
    fb.innerHTML = '<strong>✓ 正解！</strong>　' + q.explanation;
  } else {
    fb.className = 'feedback wrong-fb';
    fb.innerHTML = '<strong>✗ 不正解。</strong>　' + q.explanation;
  }
  fb.style.display = 'block';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current < total - 1 ? '次の問題へ →' : '結果を見る';
}

function nextQ() {
  current++;
  if (current >= total) showResult();
  else showQ();
}

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('result-card').style.display = 'block';
  document.getElementById('score-num').textContent = score;
  document.getElementById('score-denom').textContent = '/ ' + total + ' 問正解';
  const rate = score / total;
  let msg, sub;
  if (rate <= 0.4) {
    msg = 'もう一息！';
    sub = '基本の用語から\nもう一度復習してみましょう。';
  } else if (rate <= 0.6) {
    msg = 'がんばりました！';
    sub = '苦手な分野を重点的に\n見直してみましょう。';
  } else if (rate <= 0.8) {
    msg = 'なかなかです！';
    sub = 'あと少しで満点！\n比率系の計算を再確認しましょう。';
  } else {
    msg = 'すばらしい！';
    sub = '係数の基礎はバッチリ。\n実際の業務に活かしてみましょう！';
  }
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-sub').textContent = sub;
}

startQuiz();
</script>
