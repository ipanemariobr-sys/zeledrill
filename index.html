<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美容室スタイリスト 係数ドリル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: #FDF6F9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    width: 100%;
    max-width: 540px;
    margin-bottom: 24px;
    text-align: center;
  }

  header .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #D4537E;
    margin-bottom: 6px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #2C1A22;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 540px;
    padding: 28px 24px;
    box-shadow: 0 2px 16px rgba(212,83,126,0.08);
  }

  .progress-wrap { margin-bottom: 20px; }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .q-num { font-size: 12px; font-weight: 600; color: #999; letter-spacing: 0.08em; }

  .q-cat {
    font-size: 11px;
    background: #FBEAF0;
    color: #993556;
    padding: 3px 10px;
    border-radius: 99px;
    font-weight: 600;
  }

  .new-badge {
    font-size: 10px;
    background: #D4537E;
    color: #fff;
    padding: 2px 6px;
    border-radius: 99px;
    margin-left: 5px;
    vertical-align: middle;
  }

  .progress-bar-bg {
    height: 5px;
    background: #F0E0E8;
    border-radius: 99px;
  }

  .progress-bar-fill {
    height: 5px;
    background: linear-gradient(90deg, #D4537E, #E87FAA);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .question-text {
    font-size: 17px;
    font-weight: 600;
    color: #2C1A22;
    line-height: 1.65;
    margin: 20px 0 18px;
  }

  .choices { display: flex; flex-direction: column; gap: 10px; }

  .choice-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FAFAFA;
    border: 1.5px solid #EEE;
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    text-align: left;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .choice-btn:active { transform: scale(0.98); }
  .choice-btn:hover:not(:disabled) { border-color: #D4537E; background: #FEF0F5; }

  .choice-letter {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #EEE;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #888;
    flex-shrink: 0;
  }

  .choice-text { font-size: 15px; color: #2C1A22; line-height: 1.4; }

  .choice-btn.correct { background: #EAF3DE; border-color: #639922; }
  .choice-btn.correct .choice-letter { background: #639922; color: #fff; }
  .choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; }
  .choice-btn.wrong .choice-letter { background: #E24B4A; color: #fff; }
  .choice-btn.dimmed { opacity: 0.4; }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.65;
    display: none;
  }

  .feedback.correct-fb { background: #EAF3DE; color: #3B6D11; border: 1px solid #C0DD97; }
  .feedback.wrong-fb { background: #FCEBEB; color: #A32D2D; border: 1px solid #F09595; }

  .next-btn {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #D4537E, #E87FAA);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    display: none;
    letter-spacing: 0.04em;
    -webkit-tap-highlight-color: transparent;
  }

  .next-btn:active { transform: scale(0.98); }

  /* Result */
  .result-wrap { text-align: center; padding: 8px 0; }

  .score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #D4537E;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    background: #FEF0F5;
  }

  .score-num { font-size: 36px; font-weight: 800; color: #D4537E; line-height: 1; }
  .score-label { font-size: 13px; color: #C07090; margin-top: 4px; }
  .result-msg { font-size: 18px; font-weight: 700; color: #2C1A22; margin-bottom: 6px; }
  .result-sub { font-size: 14px; color: #888; margin-bottom: 24px; }

  .btn-row { display: flex; flex-direction: column; gap: 10px; }

  .retry-btn {
    padding: 14px;
    border-radius: 14px;
    border: 2px solid #D4537E;
    background: transparent;
    color: #D4537E;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .retry-btn:active { background: #FEF0F5; }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: #CCC;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <p class="logo">BEAUTY SALON DRILL</p>
  <h1>スタイリスト 係数ドリル</h1>
</header>

<div class="card" id="quiz-card">
  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="q-num" id="q-num">問題 1 / 8</span>
      <span class="q-cat" id="q-cat"></span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress" style="width:0%"></div>
    </div>
  </div>

  <p class="question-text" id="q-text"></p>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQ()"></button>
</div>

<div class="card result-wrap" id="result-card" style="display:none">
  <div class="score-circle">
    <span class="score-num" id="score-num"></span>
    <span class="score-label" id="score-denom"></span>
  </div>
  <p class="result-msg" id="result-msg"></p>
  <p class="result-sub" id="result-sub"></p>
  <div class="btn-row">
    <button class="retry-btn" onclick="startQuiz()">🔄 もう一度挑戦する</button>
  </div>
</div>

<footer>美容室スタイリスト向け学習ドリル</footer>

<script>
const questions = [
  {
    category: "希釈計算",
    text: "酸化染料を使う際、1剤（染料）と2剤（オキシ）を1:1で混合する。1剤を30g使う場合、2剤は何g必要か？",
    choices: ["15g", "20g", "30g", "45g"],
    answer: 2,
    explanation: "混合比1:1なので、1剤と同量の2剤が必要です。30g × 1 = 30g。混合比を正確に守ることで発色の安定と薬剤ダメージの軽減につながります。"
  },
  {
    category: "混合比率",
    text: "パーマ液を1:2（1剤:水）で希釈する。完成液200mLを作るには、1剤は何mL必要か？",
    choices: ["50mL", "67mL", "100mL", "133mL"],
    answer: 1,
    explanation: "1:2の比率なので全体の1/3が1剤です。200mL ÷ 3 ≈ 67mL。残りの133mLが水になります。"
  },
  {
    category: "オキシ濃度",
    text: "6%オキシと3%オキシを等量混ぜると、何%のオキシが得られるか？",
    choices: ["3%", "4.5%", "5%", "9%"],
    answer: 1,
    explanation: "等量混合なので、(6% + 3%) ÷ 2 = 4.5%。ダブルカラーやトーン調整で中間濃度が必要な場面でよく使われます。"
  },
  {
    category: "カラー設計",
    text: "目標の明度8レベルに仕上げたい。現在の明度が5レベルの場合、何レベル上げる必要があるか？",
    choices: ["2レベル", "3レベル", "4レベル", "5レベル"],
    answer: 1,
    explanation: "8 − 5 = 3レベルアップが必要です。1レベルにつき約3%オキシが目安とされており、3レベルアップなら通常6%オキシを選択します。"
  },
  {
    category: "薬量計算",
    text: "カラー剤の塗布量の目安は「髪の長さ × 量係数」で算出する。ロングヘア（係数3）で量係数1あたり20gとすると、必要な薬剤量は？",
    choices: ["20g", "40g", "60g", "80g"],
    answer: 2,
    explanation: "20g × 係数3 = 60g。髪の長さや量に応じて薬剤量を正確に計算することで、ムラなく仕上げることができます。"
  },
  {
    category: "売上の基本",
    isNew: true,
    text: "美容室の「売上」の説明として正しいものはどれか？",
    choices: [
      "スタイリストの給与の合計",
      "お客様から受け取った施術・商品料金の合計",
      "薬剤や備品の仕入れ金額の合計",
      "新規客の来店数の合計"
    ],
    answer: 1,
    explanation: "売上とはお客様から受け取った料金（技術料＋物販）の合計です。給与や仕入れは「コスト（原価・経費）」であり、売上とは区別されます。"
  },
  {
    category: "技術売上と商品売上",
    isNew: true,
    text: "次のうち「商品売上（物販売上）」に分類されるものはどれか？",
    choices: [
      "カットの施術料金",
      "カラーの施術料金",
      "お客様に販売したシャンプー",
      "パーマの施術料金"
    ],
    answer: 2,
    explanation: "商品売上とは、シャンプー・トリートメントなどのヘアケア商品を販売した売上です。カット・カラー・パーマなどの施術料金は「技術売上」に分類されます。理想的な物販比率は売上全体の10〜15%とされています。"
  },
  {
    category: "カルテ枚数",
    isNew: true,
    text: "ある月の技術売上が150万円で、来店客数（カルテ枚数）が100枚だった場合、客単価はいくらか？",
    choices: ["1,000円", "5,000円", "15,000円", "150,000円"],
    answer: 2,
    explanation: "客単価 = 技術売上 ÷ 来店客数（カルテ枚数）= 150万円 ÷ 100枚 = 15,000円。客単価はスタイリストの技術力やメニュー提案力を測る重要な指標です。"
  }
];

let current = 0, score = 0, answered = false;
const total = questions.length;

function startQuiz() {
  current = 0; score = 0; answered = false;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-card').style.display = 'block';
  showQ();
}

function showQ() {
  const q = questions[current];
  document.getElementById('progress').style.width = (current / total * 100) + '%';
  document.getElementById('q-num').textContent = '問題 ' + (current + 1) + ' / ' + total;
  const catEl = document.getElementById('q-cat');
  catEl.innerHTML = q.category + (q.isNew ? '<span class="new-badge">NEW</span>' : '');
  document.getElementById('q-text').textContent = q.text;

  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'none';
  answered = false;

  const letters = ['A', 'B', 'C', 'D'];
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = '<span class="choice-letter">' + letters[i] + '</span><span class="choice-text">' + c + '</span>';
    btn.onclick = () => selectAnswer(i);
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const btns = document.querySelectorAll('.choice-btn');
  const fb = document.getElementById('feedback');

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === idx && idx !== q.answer) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  if (idx === q.answer) {
    score++;
    fb.className = 'feedback correct-fb';
    fb.innerHTML = '<strong>✓ 正解！</strong>　' + q.explanation;
  } else {
    fb.className = 'feedback wrong-fb';
    fb.innerHTML = '<strong>✗ 不正解。</strong>　' + q.explanation;
  }
  fb.style.display = 'block';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current < total - 1 ? '次の問題へ →' : '結果を見る';
}

function nextQ() {
  current++;
  if (current >= total) showResult();
  else showQ();
}

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('result-card').style.display = 'block';
  document.getElementById('score-num').textContent = score;
  document.getElementById('score-denom').textContent = '/ ' + total + ' 問正解';
  const rate = score / total;
  const msgs = rate <= 0.4
    ? ['もう一息！', '基本の用語からもう一度復習してみましょう。']
    : rate <= 0.7
    ? ['なかなかです！', 'いくつかのポイントを見直してみましょう。']
    : ['よくできました！', '係数・売上の基礎はバッチリですね。'];
  document.getElementById('result-msg').textContent = msgs[0];
  document.getElementById('result-sub').textContent = msgs[1];
}

startQuiz();
</script>
</body>
</html>
